<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Living Museum of Beijing</title>
<meta name="description" content="An interactive map of Beijing told in photos and stories, layer by layer, year by year.">
<link rel="icon" href="img/seal.svg" type="image/svg+xml">
<link rel="stylesheet" href="js/vendor/leaflet.css">
<link rel="stylesheet" href="js/vendor/MarkerCluster.css">
<link rel="stylesheet" href="js/vendor/MarkerCluster.Default.css">
<link rel="stylesheet" href="css/site.css?v=1793858627">
</head>
<body class="page-map">

<header class="topbar">
  <a class="brand" href="">
    <span class="brand-seal" aria-hidden="true">京</span>
    <span class="brand-text">Living Museum<span class="brand-of">of Beijing</span></span>
  </a>
  <nav class="topnav">
    <div class="searchbox" id="searchbox">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input type="search" id="search-input" data-i18n-ph="search-ph" placeholder="Search stories…" autocomplete="off" aria-label="Search stories">
      <div class="search-drop glass" id="search-drop" hidden></div>
    </div>
    <a href="" class="active" data-i18n="nav-map">Map</a>
    <a href="submit.html" data-i18n="nav-contribute">Contribute</a>
    <a href="voices.html" data-i18n="nav-voices">Voices</a><a href="about.html" data-i18n="nav-about">About</a>
    <button class="lang-toggle" id="lang-toggle" type="button" aria-label="Switch language">中文</button>
  </nav>
</header>

<main class="map-main">
  <div id="map" class="map-canvas" role="application" aria-label="Map of Beijing with photo stories"></div>

  <section class="years-panel glass" aria-label="Year layers">
    <div class="years-head">
      <span class="years-title" data-i18n="years-title">Years</span>
      <span class="years-count" id="years-count"></span>
    </div>
    <div class="range-head">
      <span class="range-readout" id="range-readout" data-i18n="all-years">All years</span>
      <button class="play-btn" id="play-btn" type="button" aria-label="Play through time">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="range-wrap">
      <div class="range-track"><div class="range-fill" id="range-fill"></div></div>
      <input type="range" id="year-lo" aria-label="From year">
      <input type="range" id="year-hi" aria-label="To year">
    </div>
    <div class="range-ends"><span id="range-min-label"></span><span id="range-max-label"></span></div>
    <div class="theme-block">
      <span class="years-title" data-i18n="themes">Themes</span>
      <div class="chips" id="theme-chips"></div>
    </div>
  </section>

  <aside class="detail-panel glass" id="detail-panel" hidden aria-label="Story detail">
    <button class="detail-close" id="detail-close" type="button" aria-label="Close">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <img class="detail-photo" id="detail-photo" alt="">
    <div class="compare-wrap" id="compare-wrap" hidden aria-label="Then and now comparison, drag to compare">
      <img class="cmp-img" id="cmp-old" alt="">
      <img class="cmp-img cmp-new" id="cmp-new" alt="">
      <span class="cmp-label" id="cmp-old-year"></span>
      <span class="cmp-label cmp-label-r" id="cmp-new-year"></span>
      <div class="cmp-divider"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 4L2 8l3 4M11 4l3 4-3 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <div class="detail-body">
      <div class="detail-meta">
        <div class="year-chips">
          <span class="year-chip" id="detail-year"></span>
          <span class="year-chip" id="detail-year-pair" hidden></span>
        </div>
        <div class="detail-links">
          <button class="detail-share" id="share-btn" type="button">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10.5V2.5M5 5l3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 9v3.5c0 .8.7 1.5 1.5 1.5h7c.8 0 1.5-.7 1.5-1.5V9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span data-i18n="share">Share</span></button>
          <a class="detail-photo-link" id="detail-photo-link" target="_blank" rel="noopener" data-i18n="open-photo">Open photo</a>
        </div>
      </div>
      <div class="share-sheet glass" id="share-sheet" hidden>
        <button type="button" id="copy-link">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 6h7v7H6zM3 10V3h7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span id="copy-link-label" data-i18n="copy-link">Copy link</span></button>
        <button type="button" id="download-card">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M5 7l3 3 3-3M3 13h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="download-card">Download share card</span></button>
      </div>
      <h2 class="detail-title" id="detail-title"></h2>
      <a class="detail-voice" id="detail-voice" hidden></a>
      <p class="detail-story" id="detail-story"></p>
      <p class="detail-credit" id="detail-credit"></p>
    </div>
  </aside>

  <div class="featured glass" id="featured" hidden>
    <img id="featured-img" alt="">
    <div class="featured-body">
      <span class="featured-kicker" data-i18n="story-of-day">Story of the day</span>
      <span class="featured-title" id="featured-title"></span>
      <span class="featured-year" id="featured-year"></span>
      <span class="featured-excerpt" id="featured-excerpt"></span>
      <button class="featured-read" id="featured-read" type="button" data-i18n="read-story">Read the story</button>
    </div>
    <button class="featured-close" id="featured-close" type="button" aria-label="Close">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>

  <a class="fab" href="submit.html" aria-label="Contribute a photo">
    <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span data-i18n="fab-add">Add a photo</span>
  </a>

  <div class="map-hint glass" id="map-hint" data-i18n="hint">Tap a photo to read its story</div>
</main>

<script src="js/i18n.js?v=1793858627"></script>
<script src="js/tiles.js?v=1793858627"></script>
<script src="js/vendor/leaflet.js?v=1793858627"></script>
<script src="js/vendor/leaflet.markercluster.js?v=1793858627"></script>
<script src="js/vendor/qrcode.js?v=1793858627"></script>
<script src="js/map.js?v=1793858627"></script>
</body>
</html>
