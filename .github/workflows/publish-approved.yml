name: Publish approved submissions

on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.label.name == 'approved' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - run: python scripts/sync_issues.py
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push
        run: |
          git config user.name "living-museum-bot"
          git config user.email "actions@users.noreply.github.com"
          git add entries.json media e
          git diff --cached --quiet || (git commit -m "Publish approved submissions [skip ci]" && git push)
